name: Feature request
description: Suggest an improvement or new capability
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve. Large architectural changes
        should stay compatible with **offline-first** use and **ciphertext-only**
        sync (the server must not learn note plaintext).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point or gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Scraps Cache behave if this is implemented?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
  - type: dropdown
    id: privacy
    attributes:
      label: Privacy impact
      description: Does this require the server to learn more about users or notes?
      options:
        - No change to the ciphertext-relay model
        - Optional metadata only (please explain)
        - Unsure — needs design discussion
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests
          required: true
