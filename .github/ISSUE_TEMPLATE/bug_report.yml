name: Bug report
description: Something is broken or behaves unexpectedly
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security issues:** do not use this form. Report privately via
        [SECURITY.md](https://github.com/volturine/scrapscache/blob/master/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps someone else can follow.
      placeholder: |
        1. Open …
        2. Create a note …
        3. Enable sync …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Notes / editor
        - Sync / pairing
        - Backups (client)
        - Kanban
        - Attachments / images
        - Self-hosting / Docker
        - Performance
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Git tag, commit SHA, or image digest if known.
      placeholder: 'e.g. v0.0.1 or sha-abc1234'
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser + OS, or Docker / Node setup.
      placeholder: 'e.g. Firefox 140 on macOS; or compose.production.yaml'
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact secrets, pairing codes, and note content.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I redacted secrets and private note content from this report
          required: true
