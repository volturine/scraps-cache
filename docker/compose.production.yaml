name: scrapscache

services:
  app:
    image: "${SCRAPSCACHE_IMAGE:?Set SCRAPSCACHE_IMAGE to a pinned release tag or digest in .env}"
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${SCRAPSCACHE_PORT:-3000}:3000"
    environment:
      ORIGIN: "${SCRAPSCACHE_ORIGIN:-http://localhost:3000}"
      SCRAPSCACHE_ORIGIN: "${SCRAPSCACHE_ORIGIN:-http://localhost:3000}"
      SCRAPSCACHE_VAPID_PUBLIC_KEY: "${SCRAPSCACHE_VAPID_PUBLIC_KEY:-}"
      SCRAPSCACHE_VAPID_PRIVATE_KEY: "${SCRAPSCACHE_VAPID_PRIVATE_KEY:-}"
      SCRAPSCACHE_VAPID_SUBJECT: "${SCRAPSCACHE_VAPID_SUBJECT:-}"
      BODY_SIZE_LIMIT: "${SCRAPSCACHE_BODY_SIZE_LIMIT:-110M}"
      ADDRESS_HEADER: "${SCRAPSCACHE_ADDRESS_HEADER:-}"
      XFF_DEPTH: "${SCRAPSCACHE_XFF_DEPTH:-1}"
      SCRAPSCACHE_SYNC_DATA_DIR: /data
      SCRAPSCACHE_SYNC_MAX_ACCOUNT_BYTES: "${SCRAPSCACHE_SYNC_MAX_ACCOUNT_BYTES:-1000000000}"
      SCRAPSCACHE_SYNC_MAX_ACCOUNT_ENVELOPES: "${SCRAPSCACHE_SYNC_MAX_ACCOUNT_ENVELOPES:-50000}"
      SCRAPSCACHE_SYNC_MAX_CONCURRENT_REQUESTS: "${SCRAPSCACHE_SYNC_MAX_CONCURRENT_REQUESTS:-8}"
      SCRAPSCACHE_BACKUP_DIR: /backups
      SCRAPSCACHE_BACKUP_INTERVAL_HOURS: "${SCRAPSCACHE_BACKUP_INTERVAL_HOURS:-24}"
      SCRAPSCACHE_BACKUP_RETAIN: "${SCRAPSCACHE_BACKUP_RETAIN:-2}"
      SCRAPSCACHE_RETENTION_INACTIVE_DAYS: "${SCRAPSCACHE_RETENTION_INACTIVE_DAYS:-0}"
      SCRAPSCACHE_ADMIN_TOKEN: "${SCRAPSCACHE_ADMIN_TOKEN:?Set SCRAPSCACHE_ADMIN_TOKEN in .env}"
    volumes:
      - scrapscache-sync-data:/data
      - scrapscache-backup-snapshots:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  scrapscache-sync-data:
  scrapscache-backup-snapshots:
