name: scraps-cache-dev

# Preview a published PR image beside a production stack.
# Isolated project name + volumes. Host port 3000 (master here uses 5173).
#
#   cp .env.dev.example .env.dev
#   # set SCRAPS_CACHE_IMAGE=ghcr.io/volturine/scraps-cache:dev-<pr>
#   docker compose --project-directory . -f docker/compose.dev.yaml --env-file .env.dev pull
#   docker compose --project-directory . -f docker/compose.dev.yaml --env-file .env.dev up -d
#
# Change the tag: edit SCRAPS_CACHE_IMAGE in .env.dev, then pull && up -d again.

services:
  app:
    image: "${SCRAPS_CACHE_IMAGE:?Set SCRAPS_CACHE_IMAGE to a GHCR dev-* tag in .env.dev}"
    # PR images are published as linux/amd64 only.
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${SCRAPS_CACHE_PORT:-3000}:3000"
    environment:
      ORIGIN: "${SCRAPS_CACHE_ORIGIN:-http://localhost:3000}"
      SCRAPS_CACHE_ORIGIN: "${SCRAPS_CACHE_ORIGIN:-http://localhost:3000}"
      SCRAPS_CACHE_VAPID_PUBLIC_KEY: "${SCRAPS_CACHE_VAPID_PUBLIC_KEY:-}"
      SCRAPS_CACHE_VAPID_PRIVATE_KEY: "${SCRAPS_CACHE_VAPID_PRIVATE_KEY:-}"
      SCRAPS_CACHE_VAPID_SUBJECT: "${SCRAPS_CACHE_VAPID_SUBJECT:-}"
      BODY_SIZE_LIMIT: "${SCRAPS_CACHE_BODY_SIZE_LIMIT:-110M}"
      ADDRESS_HEADER: "${SCRAPS_CACHE_ADDRESS_HEADER:-}"
      XFF_DEPTH: "${SCRAPS_CACHE_XFF_DEPTH:-1}"
      SCRAPS_CACHE_SYNC_DATA_DIR: /data
      SCRAPS_CACHE_SYNC_MAX_ACCOUNT_BYTES: "${SCRAPS_CACHE_SYNC_MAX_ACCOUNT_BYTES:-1000000000}"
      SCRAPS_CACHE_SYNC_MAX_ACCOUNT_ENVELOPES: "${SCRAPS_CACHE_SYNC_MAX_ACCOUNT_ENVELOPES:-50000}"
      SCRAPS_CACHE_SYNC_MAX_CONCURRENT_REQUESTS: "${SCRAPS_CACHE_SYNC_MAX_CONCURRENT_REQUESTS:-8}"
      SCRAPS_CACHE_BACKUP_DIR: /backups
      SCRAPS_CACHE_BACKUP_INTERVAL_HOURS: "${SCRAPS_CACHE_BACKUP_INTERVAL_HOURS:-24}"
      SCRAPS_CACHE_BACKUP_RETAIN: "${SCRAPS_CACHE_BACKUP_RETAIN:-2}"
      SCRAPS_CACHE_ADMIN_TOKEN: "${SCRAPS_CACHE_ADMIN_TOKEN:-development-only-admin-token}"
    volumes:
      - scraps-cache-dev-sync-data:/data
      - scraps-cache-dev-backup-snapshots:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  scraps-cache-dev-sync-data:
  scraps-cache-dev-backup-snapshots:
