name: shard-notes-dev

# Preview a published PR image beside a production stack.
# Isolated project name + volumes. Host port 3000 (master here uses 5173).
#
#   cp .env.dev.example .env.dev
#   # set SHARD_IMAGE=ghcr.io/volturine/shard-notes:dev-<pr>
#   docker compose --project-directory . -f docker/compose.dev.yaml --env-file .env.dev pull
#   docker compose --project-directory . -f docker/compose.dev.yaml --env-file .env.dev up -d
#
# Change the tag: edit SHARD_IMAGE in .env.dev, then pull && up -d again.

services:
  app:
    image: "${SHARD_IMAGE:?Set SHARD_IMAGE to a GHCR dev-* tag in .env.dev}"
    # PR images are published as linux/amd64 only.
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${SHARD_PORT:-3000}:3000"
    environment:
      ORIGIN: "${SHARD_ORIGIN:-http://localhost:3000}"
      SHARD_ORIGIN: "${SHARD_ORIGIN:-http://localhost:3000}"
      SHARD_VAPID_PUBLIC_KEY: "${SHARD_VAPID_PUBLIC_KEY:-}"
      SHARD_VAPID_PRIVATE_KEY: "${SHARD_VAPID_PRIVATE_KEY:-}"
      SHARD_VAPID_SUBJECT: "${SHARD_VAPID_SUBJECT:-}"
      BODY_SIZE_LIMIT: "${SHARD_BODY_SIZE_LIMIT:-110M}"
      ADDRESS_HEADER: "${SHARD_ADDRESS_HEADER:-}"
      XFF_DEPTH: "${SHARD_XFF_DEPTH:-1}"
      SHARD_SYNC_DATA_DIR: /data
      SHARD_SYNC_MAX_ACCOUNT_BYTES: "${SHARD_SYNC_MAX_ACCOUNT_BYTES:-1000000000}"
      SHARD_SYNC_MAX_ACCOUNT_ENVELOPES: "${SHARD_SYNC_MAX_ACCOUNT_ENVELOPES:-50000}"
      SHARD_SYNC_MAX_CONCURRENT_REQUESTS: "${SHARD_SYNC_MAX_CONCURRENT_REQUESTS:-8}"
      SHARD_BACKUP_DIR: /backups
      SHARD_BACKUP_INTERVAL_HOURS: "${SHARD_BACKUP_INTERVAL_HOURS:-24}"
      SHARD_BACKUP_RETAIN: "${SHARD_BACKUP_RETAIN:-2}"
      SHARD_ADMIN_TOKEN: "${SHARD_ADMIN_TOKEN:-development-only-admin-token}"
    volumes:
      - shard-dev-sync-data:/data
      - shard-dev-backup-snapshots:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  shard-dev-sync-data:
  shard-dev-backup-snapshots:
