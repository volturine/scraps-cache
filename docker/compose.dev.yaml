name: scrapscache-dev

# Preview a published PR image beside a production stack.
# Isolated project name + volumes. Host port 3000 (master here uses 5173).
#
#   cp docker/.env.dev.example docker/.env.dev
#   # set SCRAPSCACHE_IMAGE=ghcr.io/volturine/scrapscache:dev-<pr>
#   docker compose --project-directory . -f docker/compose.dev.yaml --env-file docker/.env.dev pull
#   docker compose --project-directory . -f docker/compose.dev.yaml --env-file docker/.env.dev up -d
#
# Change the tag in docker/.env.dev, then pull && up -d again.

services:
  app:
    image: "${SCRAPSCACHE_IMAGE:?Set SCRAPSCACHE_IMAGE to a GHCR dev-* tag in docker/.env.dev}"
    # PR images are published as linux/amd64 only.
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${SCRAPSCACHE_BIND:-127.0.0.1}:${SCRAPSCACHE_PORT:-3000}:3000"
    environment:
      ORIGIN: "${SCRAPSCACHE_ORIGIN:-http://localhost:3000}"
      SCRAPSCACHE_ORIGIN: "${SCRAPSCACHE_ORIGIN:-http://localhost:3000}"
      SCRAPSCACHE_VAPID_PUBLIC_KEY: "${SCRAPSCACHE_VAPID_PUBLIC_KEY:-}"
      SCRAPSCACHE_VAPID_PRIVATE_KEY: "${SCRAPSCACHE_VAPID_PRIVATE_KEY:-}"
      SCRAPSCACHE_VAPID_SUBJECT: "${SCRAPSCACHE_VAPID_SUBJECT:-}"
      BODY_SIZE_LIMIT: "${SCRAPSCACHE_BODY_SIZE_LIMIT:-110M}"
      ADDRESS_HEADER: "${SCRAPSCACHE_ADDRESS_HEADER:-}"
      XFF_DEPTH: "${SCRAPSCACHE_XFF_DEPTH:-1}"
      SCRAPSCACHE_SYNC_DATA_DIR: /data
      SCRAPSCACHE_SYNC_MAX_ACCOUNT_BYTES: "${SCRAPSCACHE_SYNC_MAX_ACCOUNT_BYTES:-1000000000}"
      SCRAPSCACHE_SYNC_MAX_ACCOUNT_ENVELOPES: "${SCRAPSCACHE_SYNC_MAX_ACCOUNT_ENVELOPES:-50000}"
      SCRAPSCACHE_SYNC_MAX_CONCURRENT_REQUESTS: "${SCRAPSCACHE_SYNC_MAX_CONCURRENT_REQUESTS:-8}"
      SCRAPSCACHE_RETENTION_INACTIVE_DAYS: "${SCRAPSCACHE_RETENTION_INACTIVE_DAYS:-0}"
      SCRAPSCACHE_ADMIN_TOKEN: "${SCRAPSCACHE_ADMIN_TOKEN:-}"
    volumes:
      - scrapscache-dev-sync-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  scrapscache-dev-sync-data:
