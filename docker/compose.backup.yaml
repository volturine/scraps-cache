name: scraps-cache

services:
  backup-local:
    image: restic/restic:0.19.1
    profiles: ["backup"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export RESTIC_REPOSITORY=/repository
        export RESTIC_PASSWORD_FILE=/run/secrets/restic-password
        restic snapshots >/dev/null 2>&1 || restic init
        while true; do
          restic backup /snapshots --tag scraps-cache-sync
          restic forget --tag scraps-cache-sync --keep-daily 7 --keep-weekly 4 --keep-monthly 12 --prune
          restic check
          sleep "$${SCRAPS_CACHE_RESTIC_INTERVAL_SECONDS:-86400}"
        done
    environment:
      SCRAPS_CACHE_RESTIC_INTERVAL_SECONDS: "${SCRAPS_CACHE_RESTIC_INTERVAL_SECONDS:-86400}"
    volumes:
      - scraps-cache-backup-snapshots:/snapshots:ro
      - scraps-cache-restic-local:/repository
      - "${SCRAPS_CACHE_RESTIC_PASSWORD_FILE:-./secrets/restic-password}:/run/secrets/restic-password:ro"
    security_opt:
      - no-new-privileges:true

  backup-s3:
    image: restic/restic:0.19.1
    profiles: ["backup-s3"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export RESTIC_REPOSITORY="$${SCRAPS_CACHE_RESTIC_S3_REPOSITORY}"
        export RESTIC_PASSWORD_FILE=/run/secrets/restic-password
        export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/s3-access-key)"
        export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/s3-secret-key)"
        restic snapshots >/dev/null 2>&1 || restic init
        while true; do
          restic backup /snapshots --tag scraps-cache-sync
          restic forget --tag scraps-cache-sync --keep-daily 7 --keep-weekly 4 --keep-monthly 12 --prune
          restic check
          sleep "$${SCRAPS_CACHE_RESTIC_INTERVAL_SECONDS:-86400}"
        done
    environment:
      SCRAPS_CACHE_RESTIC_INTERVAL_SECONDS: "${SCRAPS_CACHE_RESTIC_INTERVAL_SECONDS:-86400}"
      SCRAPS_CACHE_RESTIC_S3_REPOSITORY: "${SCRAPS_CACHE_RESTIC_S3_REPOSITORY:-s3:https://storage.example.com/scraps-cache-backups}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
    volumes:
      - scraps-cache-backup-snapshots:/snapshots:ro
      - "${SCRAPS_CACHE_RESTIC_PASSWORD_FILE:-./secrets/restic-password}:/run/secrets/restic-password:ro"
      - "${SCRAPS_CACHE_S3_ACCESS_KEY_FILE:-./secrets/s3-access-key}:/run/secrets/s3-access-key:ro"
      - "${SCRAPS_CACHE_S3_SECRET_KEY_FILE:-./secrets/s3-secret-key}:/run/secrets/s3-secret-key:ro"
    security_opt:
      - no-new-privileges:true

volumes:
  scraps-cache-backup-snapshots:
  scraps-cache-restic-local:
