<!doctype html>
<html lang="en" style="background-color: #ffffff">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="text-scale" content="scale" />

		<!-- Basic Metadata & SEO -->
		<title>Scraps Cache</title>
		<meta
			name="description"
			content="Offline-first notes with optional end-to-end encrypted multi-device sync. Private by design, fast, and self-hostable."
		/>

		<!-- Open Graph / WhatsApp / Telegram / Facebook / iMessage Link Preview -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Scraps Cache" />
		<meta property="og:title" content="Scraps Cache" />
		<meta
			property="og:description"
			content="Offline-first notes with end-to-end encrypted multi-device sync."
		/>
		<meta property="og:image" content="https://scrapscache.com/og-preview.png" />
		<meta property="og:image:secure_url" content="https://scrapscache.com/og-preview.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1024" />
		<meta property="og:image:height" content="1024" />
		<meta property="og:url" content="https://scrapscache.com" />

		<!-- Twitter / X Card Link Preview -->
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="Scraps Cache" />
		<meta
			name="twitter:description"
			content="Offline-first notes with end-to-end encrypted multi-device sync."
		/>
		<meta name="twitter:image" content="https://scrapscache.com/og-preview.png" />

		<!-- iOS Native App Capabilities & Home Screen Icon -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Scraps Cache" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

		<!-- Android / Chrome Native Capabilities -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="application-name" content="Scraps Cache" />
		<meta name="theme-color" content="#1a1a1a" />
		<meta name="format-detection" content="telephone=no" />

		<!-- Favicons & Manifest -->
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
		<link rel="alternate icon" type="image/png" href="/apple-touch-icon.png" />

		<script nonce="%sveltekit.nonce%">
			// Apply theme + background BEFORE CSS loads to prevent white flash.
			// iOS reloads the page when returning to a standalone web app, and with
			// ssr=false the body is empty until Svelte boots. This sets the correct
			// background color as an inline style so it's visible immediately.
			(function () {
				try {
					var raw = localStorage.getItem('scrapscache-ui-state');
					var dark = null;
					if (raw) {
						var parsed = JSON.parse(raw);
						if (typeof parsed.dark === 'boolean') dark = parsed.dark;
					}
					if (dark === null) {
						dark = matchMedia('(prefers-color-scheme: dark)').matches;
					}
					var el = document.documentElement;
					if (dark) {
						el.classList.add('dark');
						el.style.backgroundColor = '#1a1a1a';
						el.style.colorScheme = 'dark';
					} else {
						el.classList.remove('dark');
						el.style.backgroundColor = '#ffffff';
						el.style.colorScheme = 'light';
					}
					var theme = document.querySelector('meta[name="theme-color"]');
					if (theme) theme.setAttribute('content', dark ? '#1a1a1a' : '#ffffff');
				} catch (e) {
					// Default to dark if anything fails (user prefers dark).
					document.documentElement.style.backgroundColor = '#1a1a1a';
					document.documentElement.style.colorScheme = 'dark';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="background-color: inherit">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
